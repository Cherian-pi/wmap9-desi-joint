<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΛCDM Project Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e1117;
    --surface: #161b25;
    --surface2: #1e2535;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8e4d9;
    --muted: #7a8099;
    --accent: #4fc38a;
    --accent-dim: rgba(79,195,138,0.12);
    --amber: #e8a94a;
    --amber-dim: rgba(232,169,74,0.12);
    --blue: #6aabdc;
    --blue-dim: rgba(106,171,220,0.12);
    --pink: #d47fa6;
    --pink-dim: rgba(212,127,166,0.12);
    --purple: #9b80d4;
    --purple-dim: rgba(155,128,212,0.12);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Lora', Georgia, serif;
    min-height: 100vh;
    padding: 0;
  }

  .page {
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  .masthead {
    border-bottom: 1px solid var(--border2);
    padding-bottom: 28px;
    margin-bottom: 32px;
  }

  .project-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 26px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 6px;
  }

  .supervisor {
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 28px 0;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .stat-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.06em;
  }

  .progress-wrap {
    background: var(--surface2);
    border-radius: 3px;
    height: 4px;
    margin: 20px 0 32px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  .day-block {
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .day-block.complete { border-color: rgba(79,195,138,0.3); }
  .day-block.active   { border-color: rgba(232,169,74,0.3); }

  .day-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    cursor: pointer;
    background: var(--surface);
    user-select: none;
    transition: background 0.15s;
  }

  .day-header:hover { background: var(--surface2); }

  .day-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 36px;
    letter-spacing: 0.06em;
  }

  .day-title-text {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .day-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .day-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 20px;
    letter-spacing: 0.06em;
  }

  .pill-done    { background: var(--accent-dim); color: var(--accent); }
  .pill-active  { background: var(--amber-dim); color: var(--amber); }
  .pill-todo    { background: var(--surface2); color: var(--muted); }

  .chevron {
    color: var(--muted);
    font-size: 13px;
    transition: transform 0.2s;
    font-family: 'JetBrains Mono', monospace;
  }
  .chevron.open { transform: rotate(180deg); }

  .day-body {
    display: none;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 6px 0 10px;
  }

  .day-body.open { display: block; }

  .task-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 18px;
    transition: background 0.12s;
    cursor: pointer;
  }

  .task-row:hover { background: var(--surface); }

  .cb {
    width: 17px;
    height: 17px;
    border-radius: 4px;
    border: 1px solid var(--border2);
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    cursor: pointer;
  }

  .cb.checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .cb.checked::after {
    content: '';
    display: block;
    width: 4px;
    height: 8px;
    border: 1.5px solid #0e1117;
    border-top: none;
    border-left: none;
    transform: rotate(45deg) translate(-0.5px, -1px);
  }

  .task-text {
    flex: 1;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
    transition: color 0.2s;
  }

  .task-text.done {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: rgba(122,128,153,0.5);
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    flex-shrink: 0;
    margin-top: 3px;
    letter-spacing: 0.04em;
  }

  .tag-data   { background: var(--amber-dim); color: var(--amber); }
  .tag-code   { background: var(--purple-dim); color: var(--purple); }
  .tag-plot   { background: var(--blue-dim); color: var(--blue); }
  .tag-fit    { background: var(--accent-dim); color: var(--accent); }
  .tag-write  { background: var(--pink-dim); color: var(--pink); }

  .notes-wrap {
    padding: 8px 18px 4px;
    border-top: 1px solid var(--border);
    margin-top: 6px;
  }

  .notes-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
    padding: 8px 12px;
    resize: vertical;
    min-height: 60px;
    outline: none;
    transition: border-color 0.15s;
  }

  textarea:focus { border-color: var(--border2); }
  textarea::placeholder { color: var(--muted); }

  .reset-btn {
    margin-top: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .reset-btn:hover { color: var(--text); border-color: var(--border2); }
</style>
</head>
<body>
<div class="page">

  <div class="masthead">
    <div class="project-label">ΛCDM · 8-day research plan</div>
    <h1>Fitting Λ CDM to WMAP9, DESI &amp; Planck</h1>
    <div class="supervisor">Assigned by Dr. Ido Ben-Dayan</div>
  </div>

  <div class="stats-row">
    <div class="stat">
      <div class="stat-num" id="s-done">0</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="s-left">28</div>
      <div class="stat-label">Remaining</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="s-days">0</div>
      <div class="stat-label">Days done</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="s-pct">0%</div>
      <div class="stat-label">Progress</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-fill" id="prog" style="width:0%"></div>
  </div>

  <div id="days-container"></div>

  <button class="reset-btn" onclick="resetAll()">↺ Reset all progress</button>

</div>

<script>
const DAYS = [
  { day:1, title:"Load & inspect data", tasks:[
    { t:"Download wmap_tt_spectrum_9yr_v5.txt from NASA LAMBDA", tag:"data" },
    { t:"Download COM_PowerSpect_CMB-TT-full_R3.01.txt from Planck archive", tag:"data" },
    { t:"Run step1_plot_spectra.py — confirm both files load without errors", tag:"code" },
    { t:"Print data.shape for both files and confirm column counts", tag:"code" }
  ]},
  { day:2, title:"Plot TT spectra", tasks:[
    { t:"Plot WMAP9 TT spectrum with asymmetric error bars", tag:"plot" },
    { t:"Overlay Planck 2018 TT spectrum on the same axes", tag:"plot" },
    { t:"Add CAMB best-fit theory curve over both datasets", tag:"code" },
    { t:"Save final comparison figure: tt_spectrum_comparison.png", tag:"plot" }
  ]},
  { day:3, title:"WMAP9 ΛCDM fit — MCMC run", tasks:[
    { t:"Set up CAMB + emcee pipeline for WMAP9 only", tag:"code" },
    { t:"Define Gaussian TT likelihood using WMAP9 binned spectrum", tag:"code" },
    { t:"Run MCMC — 32 walkers, 500 steps, 6-param ΛCDM", tag:"fit" },
    { t:"Check acceptance fraction (target 0.25 to 0.50)", tag:"fit" }
  ]},
  { day:4, title:"WMAP9 posterior", tasks:[
    { t:"Discard burn-in (first 200 steps) and flatten chains", tag:"fit" },
    { t:"Plot triangle posterior with getdist: H0, Ωm, ωb, ωc", tag:"plot" },
    { t:"Record recovered H0 and Ωm with 1-sigma errors", tag:"write" },
    { t:"Save chains to file: wmap9_chains.npy", tag:"data" }
  ]},
  { day:5, title:"DESI ΛCDM fit", tasks:[
    { t:"Clone CobayaSampler/bao_data and load DESI DR1 BAO data", tag:"data" },
    { t:"Load 12×12 covariance matrix and verify Cholesky decomposition", tag:"code" },
    { t:"Run MCMC — DESI BAO only, same 6-param space", tag:"fit" },
    { t:"Plot DESI-only posterior triangle", tag:"plot" }
  ]},
  { day:6, title:"Compare WMAP9 vs DESI posteriors", tasks:[
    { t:"Load both chain sets (wmap9_chains.npy, desi_chains.npy) into getdist", tag:"code" },
    { t:"Overlay WMAP9 and DESI posteriors on a single triangle plot", tag:"plot" },
    { t:"Note H0 tension between the two datasets if present", tag:"write" },
    { t:"Save figure: posterior_wmap_vs_desi.png", tag:"plot" }
  ]},
  { day:7, title:"Combined WMAP9 + DESI fit", tasks:[
    { t:"Combine likelihoods: ln_total = ln_wmap + ln_desi", tag:"code" },
    { t:"Run joint MCMC — WMAP9 + DESI, same 6-param space", tag:"fit" },
    { t:"Plot joint posterior triangle", tag:"plot" },
    { t:"Compare joint H0 and Ωm constraints against individual runs", tag:"write" }
  ]},
  { day:8, title:"Planck comparison & final plots", tasks:[
    { t:"Load published Planck 2018 MCMC chains from COM_CosmoParams zip", tag:"data" },
    { t:"Overlay all four posteriors: WMAP9, DESI, joint, Planck 2018", tag:"plot" },
    { t:"Plot best-fit theory TT spectra from all three fits on data", tag:"plot" },
    { t:"Write 1-page summary for Ido with H0, Ωm, σ8 comparison table", tag:"write" }
  ]}
];

const KEY = 'lcdm_tracker_v1';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');

function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function updateStats() {
  const total = DAYS.reduce((a, d) => a + d.tasks.length, 0);
  let done = 0, daysDone = 0;
  DAYS.forEach(d => {
    const n = d.tasks.filter((_, i) => state[`${d.day}_${i}`]).length;
    done += n;
    if (n === d.tasks.length) daysDone++;
  });
  const pct = Math.round(done / total * 100);
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-left').textContent = total - done;
  document.getElementById('s-days').textContent = daysDone;
  document.getElementById('s-pct').textContent = pct + '%';
  document.getElementById('prog').style.width = pct + '%';
}

function dayStatus(d) {
  const total = d.tasks.length;
  const done = d.tasks.filter((_, i) => state[`${d.day}_${i}`]).length;
  if (done === total) return 'complete';
  if (done > 0) return 'active';
  return 'todo';
}

function pillClass(s) { return s === 'complete' ? 'pill-done' : s === 'active' ? 'pill-active' : 'pill-todo'; }
function pillLabel(s) { return s === 'complete' ? 'done' : s === 'active' ? 'active' : 'to do'; }

function render() {
  const c = document.getElementById('days-container');
  c.innerHTML = '';
  DAYS.forEach(d => {
    const status = dayStatus(d);
    const doneTasks = d.tasks.filter((_, i) => state[`${d.day}_${i}`]).length;
    const isOpen = !!state[`open_${d.day}`];

    const block = document.createElement('div');
    block.className = `day-block ${status}`;

    const header = document.createElement('div');
    header.className = 'day-header';
    header.innerHTML = `
      <span class="day-num">Day ${d.day}</span>
      <span class="day-title-text">${d.title}</span>
      <span class="day-count">${doneTasks}/${d.tasks.length}</span>
      <span class="day-pill ${pillClass(status)}">${pillLabel(status)}</span>
      <span class="chevron ${isOpen ? 'open' : ''}">▾</span>
    `;
    header.addEventListener('click', () => {
      state[`open_${d.day}`] = !state[`open_${d.day}`];
      save(); render(); updateStats();
    });

    const body = document.createElement('div');
    body.className = `day-body ${isOpen ? 'open' : ''}`;

    d.tasks.forEach((task, i) => {
      const key = `${d.day}_${i}`;
      const checked = !!state[key];
      const row = document.createElement('div');
      row.className = 'task-row';
      row.innerHTML = `
        <div class="cb ${checked ? 'checked' : ''}"></div>
        <span class="task-text ${checked ? 'done' : ''}">${task.t}</span>
        <span class="tag tag-${task.tag}">${task.tag}</span>
      `;
      row.addEventListener('click', () => {
        state[key] = !state[key];
        save(); render(); updateStats();
      });
      body.appendChild(row);
    });

    const noteKey = `note_${d.day}`;
    const nw = document.createElement('div');
    nw.className = 'notes-wrap';
    nw.innerHTML = `<div class="notes-label">Notes · Day ${d.day}</div>
      <textarea placeholder="Record results, errors, H0 values…">${state[noteKey] || ''}</textarea>`;
    nw.querySelector('textarea').addEventListener('input', e => {
      state[noteKey] = e.target.value; save();
    });
    nw.querySelector('textarea').addEventListener('click', e => e.stopPropagation());
    body.appendChild(nw);

    block.appendChild(header);
    block.appendChild(body);
    c.appendChild(block);
  });
  updateStats();
}

function resetAll() {
  if (confirm('Reset all progress and notes?')) {
    localStorage.removeItem(KEY);
    state = {};
    render();
  }
}

render();
</script>
</body>
</html>
